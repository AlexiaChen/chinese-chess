name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run native build and tests
        run: make test-release

  web:
    name: WASM and web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Read pinned Emscripten version
        id: emscripten-version
        shell: bash
        run: echo "version=$(<.emscripten-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.emscripten-version.outputs.version }}

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Build Pages-targeted WASM and frontend bundle
        run: make pages-build
